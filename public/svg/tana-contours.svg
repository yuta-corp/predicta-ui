<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified Tana road network - main arteries radiating from center -->
  <!-- These represent the major roads in Antananarivo -->
  <path d="M100,100 L100,20" stroke="currentColor" stroke-width="2" fill="none"/> <!-- North -->
  <path d="M100,100 L180,180" stroke="currentColor" stroke-width="2" fill="none"/> <!-- Northeast -->
  <path d="M100,100 L180,100" stroke="currentColor" stroke-width="2" fill="none"/> <!-- East -->
  <path d="M100,100 L180,20" stroke="currentColor" stroke-width="2" fill="none"/> <!-- Southeast -->
  <path d="M100,100 L20,180" stroke="currentColor" stroke-width="2" fill="none"/> <!-- Southwest -->
  <path d="M100,100 L20,100" stroke="currentColor" stroke-width="2" fill="none"/> <!-- West -->
  <path d="M100,100 L20,20" stroke="currentColor" stroke-width="2" fill="none"/> <!-- Northwest -->
  <!-- Ring road approximation -->
  <path d="M60,60 L140,60 L140,140 L60,140 Z" stroke="currentColor" stroke-width="1.5" fill="none"/> 
</svg>
